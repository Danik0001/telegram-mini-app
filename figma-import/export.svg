iddle">ASIQPAI</text><text x="97.15" y="104.4" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="rgb(223, 188, 120)" text-anchor="middle">/</text><text x="276.32" y="101.9" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="rgb(223, 188, 120)" >MVP / REDESIGN</text><text x="49.89" y="157.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="rgb(175, 180, 167)" text-anchor="middle">← Назад</text><text x="259.16" y="153.9" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="rgb(175, 180, 167)" >ДЕМО ИНТЕРФЕЙСА</text><text x="21" y="199.5" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="rgb(223, 188, 120)" >STUDIO / ASIQPAI</text><text x="21" y="245.5" font-family="Arial,sans-serif" font-size="30" font-weight="600" fill="rgb(245, 242, 233)" >Сохрани свой звук</text><text x="21" y="280.4" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="rgb(175, 180, 167)" >Экспорт готового демомикса.</text><text x="21" y="329.1" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="rgb(175, 180, 167)" >Формат</text><text x="342.62" y="329.1" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="rgb(245, 242, 233)" >WAV</text><text x="21" y="382.1" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="rgb(175, 180, 167)" >Содержимое</text><text x="208.66" y="382.1" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="rgb(245, 242, 233)" >MID + BACK + ADLIBS + бит</text><text x="21" y="426.8" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="rgb(175, 180, 167)" >Частота и разрядность должны соответствовать</text><text x="21" y="449.2" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="rgb(175, 180, 167)" >реальному экспорту MVP. Не предлагаем</text><text x="21" y="471.6" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="rgb(175, 180, 167)" >неподтверждённые варианты.</text><text x="37" y="520.14" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="rgb(223, 188, 120)" >Лицензия на бит</text><text x="37" y="542.29" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="rgb(175, 180, 167)" >Скачивание WAV не означает покупку лицензии на</text><text x="37" y="561.49" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="rgb(175, 180, 167)" >инструментал.</text><text x="195" y="623.96" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="rgb(22, 23, 16)" text-anchor="middle">Посмотреть состояние скачивания</text><text x="195" y="686.96" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="rgb(245, 242, 233)" text-anchor="middle">Назад к миксу</text><text x="45.27" y="776.46" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="rgb(175, 180, 167)" text-anchor="middle">Music</text><text x="45.27" y="764.48" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="rgb(175, 180, 167)" text-anchor="middle">♫</text><text x="119.82" y="776.46" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="rgb(175, 180, 167)" text-anchor="middle">Library</text><text x="119.82" y="764.48" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="rgb(175, 180, 167)" text-anchor="middle">▱</text><text x="194.38" y="776.46" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="rgb(223, 188, 120)" text-anchor="middle">AI Studio</text><text x="194.38" y="764.48" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="rgb(223, 188, 120)" text-anchor="middle">≋</text><text x="268.93" y="776.46" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="rgb(175, 180, 167)" text-anchor="middle">Wallet</text><text x="268.93" y="764.48" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="rgb(175, 180, 167)" text-anchor="middle">◈</text><text x="344